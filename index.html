<script>
const greetEl=document.getElementById('greet'),clockEl=document.getElementById('clock'),dateEl=document.getElementById('date');
function tick(){
  const d=new Date(),h=d.getHours();
  greetEl.textContent = h>=5&&h<12 ? 'בוקר טוב' : h>=12&&h<17 ? 'צהריים טובים' : 'ערב טוב';
  clockEl.textContent = String(h).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  dateEl.textContent = d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});
}
tick(); setInterval(tick,10000);

/* ---------- Lounge radio (SomaFM, listener-supported, no ads) ---------- */
const HOSTS=['ice1','ice2','ice4','ice6'];
const STATIONS=[
  {name:'Groove Salad', id:'groovesalad'},
  {name:'Lush',         id:'lush'},
  {name:'Secret Agent', id:'secretagent'}
];
const VOL=.35;
let st=0, hostIdx=0, musicOn=true, fadeT=null, playing=false;
const audio=new Audio(); audio.preload='none'; audio.volume=0;
const toast=document.createElement('div');
toast.style.cssText='position:absolute;bottom:11vh;left:4.5vw;max-width:30vw;font-family:"Frank Ruhl Libre",serif;font-size:1.3vw;color:var(--navy);text-shadow:0 0 .8vw #fff,0 0 .3vw #fff;opacity:0;transition:opacity .4s';
document.body.appendChild(toast);
function showToast(t,ms){ toast.textContent=t; toast.style.opacity=1; clearTimeout(toast._t); toast._t=setTimeout(()=>toast.style.opacity=0,ms||2500); }
function fadeTo(v,ms,done){
  clearInterval(fadeT);
  const from=audio.volume, steps=Math.max(1,Math.round(ms/50)); let i=0;
  fadeT=setInterval(()=>{ i++; audio.volume=Math.min(1,Math.max(0,from+(v-from)*i/steps));
    if(i>=steps){clearInterval(fadeT); done&&done();} },50);
}
function streamUrl(){ return 'https://'+HOSTS[hostIdx]+'.somafm.com/'+STATIONS[st].id+'-128-mp3'; }
function startMusic(){
  if(!musicOn || playing) return;
  playing=true;
  audio.src=streamUrl(); audio.volume=0;
  audio.play().then(()=>fadeTo(VOL,3000)).catch(err=>{
    playing=false;
    if(err && err.name==='NotAllowedError') showToast('לחצו על מקש כלשהו להפעלת המוזיקה',4000);
  });
}
function hardStop(){ audio.pause(); audio.removeAttribute('src'); audio.load(); playing=false; }
function stopMusic(fast){ if(!playing) return; fadeTo(0,fast?300:1200,hardStop); }
audio.addEventListener('error',()=>{
  if(!audio.getAttribute('src')) return;
  playing=false;
  hostIdx=(hostIdx+1)%HOSTS.length;
  if(hostIdx===0){ showToast('אין חיבור לרדיו כרגע, מנסה שוב…',3000); setTimeout(startMusic,15000); }
  else startMusic();
});
const musicBtn=document.getElementById('music');
musicBtn.addEventListener('click',e=>{
  e.preventDefault(); e.stopPropagation();
  if(!musicOn){ musicOn=true; st=0; }
  else if(playing && st<STATIONS.length-1){ st++; }
  else if(playing){ musicOn=false; }
  musicBtn.classList.toggle('off',!musicOn);
  clearInterval(fadeT); hardStop(); startMusic();
  showToast(musicOn ? '♪ '+STATIONS[st].name : 'מוזיקה כבויה');
});
// any interaction unlocks audio (browsers block sound until the first click/key)
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>startMusic(),{passive:true}));
document.addEventListener('visibilitychange',()=>document.hidden?stopMusic(true):startMusic());
window.addEventListener('load',()=>setTimeout(startMusic,600));

/* ---------- App launching ---------- */
function intentFor(pkg,web){
  let s='intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LEANBACK_LAUNCHER;package='+pkg+';';
  if(web) s+='S.browser_fallback_url='+encodeURIComponent(web)+';';
  return s+'end';
}
const apps=[...document.querySelectorAll('.app')];
apps.filter(a=>a.dataset.pkg).forEach(a=>a.addEventListener('click',e=>{
  e.preventDefault(); stopMusic(true);
  const pkg=a.dataset.pkg, web=a.dataset.web;
  setTimeout(()=>{ location.href=intentFor(pkg,web); },250);
}));
document.addEventListener('keydown',e=>{
  const i=apps.indexOf(document.activeElement);
  if(e.key==='ArrowLeft'){apps[Math.min(apps.length-1,i+1)].focus();e.preventDefault();}
  if(e.key==='ArrowRight'){apps[Math.max(0,i-1)].focus();e.preventDefault();}
  if(i<0&&(e.key.startsWith('Arrow')||e.key==='Enter')){apps[0].focus();e.preventDefault();}
});
window.addEventListener('load',()=>apps[0].focus());
</script>
</body>
</html>
